<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>福瑞斯特中小學 - 115-1 社團點名系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<!-- Signature Pad 手寫簽名套件 -->
<script src="https://cdn.jsdelivr.net/npm/signature_pad@4.1.7/dist/signature_pad.umd.min.js"></script>
<style>
  :root {
    --bg: #F4F9F1;
    --card: #FFFFFF;
    --ink: #2B3A3A;
    --ink-soft: #6E7E7C;
    --primary: #45B66E;
    --primary-dark: #2F9A57;
    --primary-tint: #E3F6E9;
    --yellow: #FFC857;
    --yellow-tint: #FFF4DC;
    --coral: #FF7F6B;
    --coral-tint: #FFE6E1;
    --blue: #6FB1E8;
    --pink: #FFA9C7;
    --lavender: #B39DDB;
    --radius-lg: 28px;
    --radius-md: 18px;
    --radius-sm: 12px;
    --shadow: 0 12px 30px -12px rgba(43, 58, 58, 0.18);
  }

  * { box-sizing: border-box; }

  html, body {
    width: 100%;
    overflow-x: hidden;
    background: var(--bg);
    font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    color: var(--ink);
    position: relative;
    margin: 0;
    padding: 0;
  }

  /* 背景四角柔和色塊裝飾 */
  .blob {
    position: fixed;
    border-radius: 50%;
    filter: blur(2px);
    opacity: 0.55;
    z-index: 0;
    pointer-events: none;
  }
  .blob-1 { width: 220px; height: 220px; background: var(--pink); top: -80px; left: -70px; }
  .blob-2 { width: 160px; height: 160px; background: var(--blue); top: 120px; right: -60px; }
  .blob-3 { width: 180px; height: 180px; background: var(--yellow); bottom: 40px; left: -80px; }
  .blob-4 { width: 140px; height: 140px; background: var(--lavender); bottom: -60px; right: -40px; }

  .main-container {
    position: relative;
    z-index: 1;
    max-width: 500px;
    width: 100%;
    margin: 0 auto;
    padding: 28px 16px 60px;
  }

  /* 校徽與標頭 */
  .header-block { text-align: center; margin-bottom: 22px; }
  .header-block img {
    width: 85%;
    max-width: 280px;
    height: auto;
    display: block;
    margin: 0 auto 12px;
  }
  .header-block h4 {
    font-weight: 900;
    font-size: 1.35rem;
    margin: 0 0 4px;
    color: var(--ink);
  }
  .header-block .sub {
    font-family: "Baloo 2", sans-serif;
    font-weight: 500;
    font-size: 0.85rem;
    color: var(--ink-soft);
  }

  .card {
    background: var(--card);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow);
    border: none;
    padding: 22px 20px;
    margin-bottom: 18px;
  }

  .step-eyebrow {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: "Baloo 2", sans-serif;
    font-weight: 700;
    font-size: 0.8rem;
    color: var(--primary-dark);
    margin-bottom: 14px;
  }
  .step-eyebrow .num {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: var(--primary-tint);
    color: var(--primary-dark);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.75rem;
    flex-shrink: 0;
  }

  .form-label {
    display: block;
    font-weight: 700;
    font-size: 0.88rem;
    margin: 0 0 8px;
    color: var(--ink);
  }

  select.form-select {
    width: 100%;
    appearance: none;
    -webkit-appearance: none;
    background: var(--bg) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='9' viewBox='0 0 14 9'><path d='M1 1L7 7L13 1' stroke='%232B3A3A' stroke-width='2' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>") no-repeat right 16px center;
    border: 2px solid transparent;
    border-radius: var(--radius-sm);
    padding: 13px 40px 13px 16px;
    font-size: 1rem;
    font-family: inherit;
    color: var(--ink);
    margin-bottom: 16px;
  }
  select.form-select:disabled { opacity: 0.55; }

  /* 學生清單 */
  #studentList { display: flex; flex-direction: column; gap: 10px; }

  #studentList > div {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    background: var(--bg);
    border-radius: var(--radius-md);
    padding: 12px 14px;
  }

  #studentList .badge {
    display: inline-block;
    background: var(--primary-tint);
    color: var(--primary-dark);
    font-family: "Baloo 2", sans-serif;
    font-weight: 700;
    font-size: 0.7rem;
    padding: 3px 9px;
    border-radius: 999px;
    margin-bottom: 4px;
  }

  #studentList .fw-bold { font-weight: 700; font-size: 1.02rem; }

  .status-btn-group {
    display: inline-flex;
    background: #fff;
    border-radius: 999px;
    padding: 3px;
    gap: 2px;
    box-shadow: inset 0 0 0 1.5px #E7EEE7;
  }
  .status-btn-group input[type="radio"] { display: none; }
  .status-btn-group label {
    padding: 7px 12px;
    border-radius: 999px;
    cursor: pointer;
    font-size: 0.8rem;
    font-weight: 700;
    color: var(--ink-soft);
    transition: all 0.15s ease;
  }
  .status-btn-group input[value="出席"]:checked + label { background: var(--primary); color: #fff; }
  .status-btn-group input[value="請假"]:checked + label { background: var(--yellow); color: #5A4200; }
  .status-btn-group input[value="缺席"]:checked + label { background: var(--coral); color: #fff; }

  /* 按鈕樣式 */
  button {
    font-family: inherit;
    border: none;
    cursor: pointer;
    font-weight: 700;
    border-radius: var(--radius-sm);
    transition: transform 0.1s ease;
  }
  button:active { transform: scale(0.97); }

  .btn-primary {
    width: 100%;
    background: var(--primary);
    color: #fff;
    padding: 14px 16px;
    font-size: 1rem;
    box-shadow: 0 8px 18px -6px rgba(69, 182, 110, 0.55);
  }
  
  .btn-outline {
    width: 100%;
    background: #fff;
    border: 2px dashed var(--primary);
    color: var(--primary-dark);
    padding: 16px;
    font-size: 1rem;
    border-radius: var(--radius-md);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .btn-secondary {
    background: var(--bg);
    color: var(--ink-soft);
    padding: 12px 20px;
    font-size: 0.9rem;
  }

  /* 簽名預覽區 */
  .signature-preview-box {
    border: 2px solid var(--primary-tint);
    border-radius: var(--radius-md);
    padding: 12px;
    background: #FAFDFB;
    text-align: center;
    margin-bottom: 16px;
  }
  .signature-preview-box img {
    max-width: 100%;
    height: 100px;
    object-fit: contain;
  }

  /* 獨立全螢幕簽名 Modal 彈窗 */
  .modal-overlay {
    position: fixed;
    top: 0; left: 0; width: 100vw; height: 100vh;
    background: rgba(43, 58, 58, 0.6);
    backdrop-filter: blur(4px);
    z-index: 9999;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .modal-overlay.active { display: flex; }

  .modal-card {
    background: #fff;
    width: 100%;
    max-width: 600px;
    border-radius: var(--radius-lg);
    padding: 20px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.2);
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .modal-header h3 { margin: 0; font-size: 1.1rem; color: var(--ink); }

  #modal-canvas-container {
    width: 100%;
    height: 280px; /* 大畫布，超好寫 */
    border: 2.5px dashed #CFE3D3;
    border-radius: var(--radius-md);
    background: #fff;
    touch-action: none;
  }
  #modal-signature-pad {
    width: 100%;
    height: 100%;
  }

  .modal-actions {
    display: flex;
    gap: 10px;
  }
  .modal-actions button { flex: 1; }
</style>
</head>
<body>

  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
  <div class="blob blob-4"></div>

  <div class="main-container">
    <!-- 校徽與標頭區塊 -->
    <div class="header-block">
      <img src="logo.png" alt="福瑞斯特中小學 Logo" onerror="this.style.display='none'">
      <h4>115-1 社團線上點名系統</h4>
      <div class="sub">Forestry School Club Rollcall</div>
    </div>

    <!-- 步驟 1: 選擇社團 -->
    <div class="card">
      <div class="step-eyebrow"><span class="num">1</span>選擇社團</div>
      <label class="form-label">選擇學段 / 時間</label>
      <select id="categorySelect" class="form-select" onchange="filterClubs()">
        <option value="">-- 請選擇學段 --</option>
        <option value="國小低年級">國小低年級（星期二）</option>
        <option value="國小中高年級">國小中高年級（星期二）</option>
        <option value="國中">國中（星期三）</option>
      </select>

      <label class="form-label">選擇社團</label>
      <select id="clubSelect" class="form-select" onchange="loadStudents()" disabled>
        <option value="">-- 請先選擇學段 --</option>
      </select>
    </div>

    <!-- 步驟 2: 學生點名 -->
    <div id="rollcallSection" class="card" style="display: none;">
      <div class="step-eyebrow"><span class="num">2</span>學生點名（預設全員出席）</div>
      <div id="studentList"></div>
    </div>

    <!-- 步驟 3: 簽名確認與送出 -->
    <div id="signatureSection" class="card" style="display: none;">
      <div class="step-eyebrow"><span class="num">3</span>指導老師簽名確認</div>
      
      <!-- 未簽名狀態顯示的按鈕 -->
      <button id="openSignatureBtn" class="btn-outline" onclick="openSignatureModal()">
        ✍️ 點此開啟大畫布手寫簽名
      </button>

      <!-- 已簽名完成後的預覽圖 -->
      <div id="signaturePreview" class="signature-preview-box" style="display: none;">
        <div style="font-size: 0.8rem; color: var(--ink-soft); margin-bottom: 6px;">指導老師親筆簽名：</div>
        <img id="previewImg" src="" alt="指導老師簽名">
        <div style="margin-top: 8px;">
          <button class="btn-secondary" onclick="openSignatureModal()" style="padding: 6px 14px; font-size: 0.8rem;">重新簽名</button>
        </div>
      </div>

      <button class="btn-primary" style="margin-top: 16px;" onclick="submitRollcall()">確認送出點名</button>
    </div>
  </div>

  <!-- 獨立大畫布 Modal 視窗 -->
  <div id="signatureModal" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-header">
        <h3>✍️ 請指導老師親筆簽名</h3>
        <span style="font-size: 0.8rem; color: var(--ink-soft);">（請使用全空白處簽名）</span>
      </div>
      
      <div id="modal-canvas-container">
        <canvas id="modal-signature-pad"></canvas>
      </div>

      <div class="modal-actions">
        <button class="btn-secondary" onclick="clearModalSignature()">重寫</button>
        <button class="btn-primary" onclick="saveModalSignature()">完成簽名</button>
      </div>
    </div>
  </div>

  <script>
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbz2hL5IREZFWhJiwMwSLcMkMP1oPPczBOZLmMpKfYDnrXxzdhuHlGYpvON7zKlQ23BD/exec";

    let modalSignaturePad;
    let signatureDataURL = ""; // 儲存簽名圖檔

    window.onload = function() {
      const canvas = document.getElementById('modal-signature-pad');
      modalSignaturePad = new SignaturePad(canvas, {
        backgroundColor: 'rgb(255, 255, 255)',
        penColor: 'rgb(0, 0, 0)'
      });

      // 旋轉手機時自動調整畫布大小
      window.addEventListener("resize", resizeModalCanvas);
    };

    // 開啟簽名彈窗
    function openSignatureModal() {
      const modal = document.getElementById('signatureModal');
      modal.classList.add('active');
      setTimeout(() => {
        resizeModalCanvas();
      }, 100);
    }

    // 調整畫布清晰度與大小
    function resizeModalCanvas() {
      const canvas = document.getElementById('modal-signature-pad');
      const container = document.getElementById('modal-canvas-container');
      if (!canvas || !container) return;

      const ratio = Math.max(window.devicePixelRatio || 1, 1);
      
      let data = null;
      if (modalSignaturePad && !modalSignaturePad.isEmpty()) {
        data = modalSignaturePad.toData();
      }

      canvas.width = container.offsetWidth * ratio;
      canvas.height = container.offsetHeight * ratio;
      canvas.getContext("2d").scale(ratio, ratio);

      if (modalSignaturePad) {
        modalSignaturePad.clear();
        if (data) {
          modalSignaturePad.fromData(data);
        }
      }
    }

    // 清空簽名
    function clearModalSignature() {
      if (modalSignaturePad) {
        modalSignaturePad.clear();
      }
    }

    // 儲存簽名並回到主畫面
    function saveModalSignature() {
      if (!modalSignaturePad || modalSignaturePad.isEmpty()) {
        alert("請完成簽名後再點選「完成簽名」！");
        return;
      }

      signatureDataURL = modalSignaturePad.toDataURL('image/png');
      
      // 更新主畫面顯示
      document.getElementById('openSignatureBtn').style.display = 'none';
      document.getElementById('signaturePreview').style.display = 'block';
      document.getElementById('previewImg').src = signatureDataURL;

      // 關閉 Modal
      document.getElementById('signatureModal').classList.remove('active');
    }

    function filterClubs() {
      const category = document.getElementById("categorySelect").value;
      const clubSelect = document.getElementById("clubSelect");

      if (!category) {
        clubSelect.innerHTML = '<option value="">-- 請先選擇學段 --</option>';
        clubSelect.disabled = true;
        return;
      }

      clubSelect.innerHTML = '<option value="">-- 載入社團名單中... --</option>';
      clubSelect.disabled = true;

      fetch(`${GAS_WEB_APP_URL}?action=getClubs&category=${encodeURIComponent(category)}`)
        .then(res => res.json())
        .then(clubs => {
          clubSelect.innerHTML = '<option value="">-- 請選擇社團 --</option>';
          clubs.forEach(c => {
            clubSelect.innerHTML += `<option value="${c.id}">${c.name} (${c.id})</option>`;
          });
          clubSelect.disabled = false;
        })
        .catch(err => alert("無法讀取社團清單，請確認網路連線。"));

      document.getElementById("rollcallSection").style.display = "none";
      document.getElementById("signatureSection").style.display = "none";
    }

    function loadStudents() {
      const clubId = document.getElementById("clubSelect").value;
      if (!clubId) return;

      const studentListDiv = document.getElementById("studentList");
      studentListDiv.innerHTML = '<div style="text-align:center; padding: 12px 0; color: var(--ink-soft);">正在載入學生名單...</div>';
      document.getElementById("rollcallSection").style.display = "block";

      fetch(`${GAS_WEB_APP_URL}?action=getStudents&clubId=${encodeURIComponent(clubId)}`)
        .then(res => res.json())
        .then(students => {
          studentListDiv.innerHTML = "";
          if (students.length === 0) {
            studentListDiv.innerHTML = '<div style="background: var(--yellow-tint); color: #8A6200; border-radius: 12px; padding: 14px; text-align: center;">此社團目前沒有學生資料。</div>';
            return;
          }

          students.forEach((s, idx) => {
            studentListDiv.innerHTML += `
              <div data-seat="${s.seat}">
                <div style="min-width: 0;">
                  <span class="badge">${s.seat}</span>
                  <div class="fw-bold">${s.name}</div>
                </div>
                <div class="status-btn-group flex-shrink-0">
                  <input type="radio" id="p_${idx}_1" name="st_${idx}" value="出席" checked>
                  <label for="p_${idx}_1">出席</label>
                  <input type="radio" id="p_${idx}_2" name="st_${idx}" value="請假">
                  <label for="p_${idx}_2">請假</label>
                  <input type="radio" id="p_${idx}_3" name="st_${idx}" value="缺席">
                  <label for="p_${idx}_3">缺席</label>
                </div>
              </div>
            `;
          });

          document.getElementById("signatureSection").style.display = "block";
        });
    }

    // ⚡ 包含時間帶入與完整資料送出
    function submitRollcall() {
      if (!signatureDataURL) {
        alert("請指導老師完成親筆簽名後再送出！");
        openSignatureModal();
        return;
      }

      const clubSelect = document.getElementById("clubSelect");
      const clubId = clubSelect.value;
      const clubName = clubSelect.options[clubSelect.selectedIndex].text;
      const studentRows = document.querySelectorAll("#studentList > div");
      let records = [];

      studentRows.forEach((row, idx) => {
        const seat = row.getAttribute("data-seat");
        const name = row.querySelector(".fw-bold").innerText;
        const status = row.querySelector(`input[name="st_${idx}"]:checked`).value;
        records.push({ seat: seat, name: name, status: status });
      });

      const now = new Date();
      const currentDate = now.toLocaleDateString('zh-TW'); // 格式: yyyy/M/d
      const currentTime = now.toTimeString().split(' ')[0]; // 格式: HH:mm:ss

      const payload = {
        action: "saveRollcall",
        school: "福瑞斯特中小學",
        semester: "115-1",
        clubId: clubId,
        clubName: clubName,
        date: currentDate,
        time: currentTime, // 帶入點名時間
        signature: signatureDataURL,
        records: records
      };

      fetch(GAS_WEB_APP_URL, {
        method: "POST",
        body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(data => {
        alert("點名完成！紀錄已順利存入系統。");
        location.reload();
      })
      .catch(err => {
        alert("資料已送出！");
        location.reload();
      });
    }
  </script>
</body>
</html>
