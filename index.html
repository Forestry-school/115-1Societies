<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>社團線上點名系統</title>
  <style>
    :root {
      --primary-color: #2E5138;
      --primary-hover: #1f3726;
      --bg-color: #FAF8F5;
      --card-bg: #FFFFFF;
      --text-color: #333333;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 15px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 600px;
      background: var(--card-bg);
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      padding: 20px;
      box-sizing: border-box;
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    .header h2 {
      color: var(--primary-color);
      margin: 0 0 5px 0;
    }

    .section {
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 1px dashed #E0E0E0;
    }

    label {
      font-weight: bold;
      display: block;
      margin-bottom: 8px;
      color: #555;
    }

    select, input {
      width: 100%;
      padding: 12px;
      border: 1px solid #CCC;
      border-radius: 8px;
      font-size: 1rem;
      box-sizing: border-box;
      margin-bottom: 12px;
      background-color: #FFF;
    }

    .student-list {
      margin-top: 15px;
    }

    .student-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      background-color: #F9F9F9;
      border-radius: 8px;
      margin-bottom: 10px;
      border: 1px solid #EEE;
    }

    .student-info {
      font-size: 1.05rem;
      font-weight: 500;
    }

    .status-btn-group {
      display: flex;
      gap: 6px;
    }

    .status-btn {
      padding: 6px 12px;
      border: 1px solid #CCC;
      border-radius: 6px;
      background: #FFF;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .status-btn.active-present {
      background-color: #27ae60;
      color: white;
      border-color: #27ae60;
    }

    .status-btn.active-absent {
      background-color: #e74c3c;
      color: white;
      border-color: #e74c3c;
    }

    .sig-trigger-btn {
      width: 100%;
      padding: 12px;
      background-color: #4A6B53;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    .submit-btn {
      width: 100%;
      padding: 15px;
      background-color: var(--primary-color);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }

    .submit-btn:hover {
      background-color: var(--primary-hover);
    }

    /* ==========================================
       全螢幕簽名彈窗 Modal 樣式
       ========================================== */
    .sig-modal {
      display: none; /* 預設隱藏 */
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #FFFFFF;
      z-index: 9999;
      flex-direction: column;
    }

    .sig-modal.active {
      display: flex;
    }

    .sig-modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px;
      background-color: var(--primary-color);
      color: white;
      font-size: 1.1rem;
      font-weight: bold;
    }

    .sig-btn-group {
      display: flex;
      gap: 10px;
    }

    .sig-btn-group button {
      padding: 8px 16px;
      border-radius: 6px;
      border: none;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.95rem;
    }

    .sig-btn-group .btn-clear {
      background-color: #e74c3c;
      color: white;
    }

    .sig-btn-group .btn-confirm {
      background-color: #27ae60;
      color: white;
    }

    .sig-modal-body {
      flex: 1;
      position: relative;
      background-color: #F9F9F9;
      touch-action: none; /* 阻斷手機螢幕滾動，讓簽名順暢 */
    }

    #fullscreenCanvas {
      width: 100%;
      height: 100%;
      cursor: crosshair;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h2>🌿 福瑞斯特中小學 社團點名系統</h2>
    </div>

    <!-- 1. 選擇學段與社團 -->
    <div class="section">
      <label for="categorySelect">1. 選擇學段 / 時間類別</label>
      <select id="categorySelect" onchange="loadClubs()">
        <option value="">-- 載入中，請稍候 --</option>
      </select>

      <label for="clubSelect">2. 選擇社團</label>
      <select id="clubSelect" onchange="loadStudents()">
        <option value="">-- 請先選擇學段 --</option>
      </select>
    </div>

    <!-- 2. 學生點名區 -->
    <div class="section">
      <label>3. 學生點名</label>
      <div id="studentListContainer" class="student-list">
        <p style="color: #888; text-align: center;">請先選擇社團以載入學生名單</p>
      </div>
    </div>

    <!-- 3. 導師親筆簽名區（點擊開啟全螢幕簽名） -->
    <div class="section">
      <label>4. 指導老師親筆簽名</label>
      <button type="button" class="sig-trigger-btn" onclick="openSignatureModal()">
        ✍️ 點此進行「全螢幕」導師簽名
      </button>
      <p id="sigStatusNotice" style="text-align: center; color: #888; margin-top: 8px; font-size: 0.9rem;">
        目前狀態：尚未簽名
      </p>
    </div>

    <button type="button" class="submit-btn" onclick="submitRollcall()">送出點名紀錄</button>
  </div>

  <!-- 全螢幕簽名彈窗 (Fullscreen Signature Modal) -->
  <div id="signatureModal" class="sig-modal">
    <div class="sig-modal-header">
      <span>✍️ 請在下方空白處完成親筆簽名</span>
      <div class="sig-btn-group">
        <button type="button" class="btn-clear" onclick="clearModalCanvas()">🗑️ 重簽</button>
        <button type="button" class="btn-confirm" onclick="confirmSignature()">✅ 完成簽名</button>
      </div>
    </div>
    <div class="sig-modal-body">
      <canvas id="fullscreenCanvas"></canvas>
    </div>
  </div>

  <script>
    // 🔗 已幫您填入貼上的 Web App 網址
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwVO9UVWa8MtWvszbvrAYI4vxkJpZIQWIey-JWlx7Rh_M9GZDvhcP8W7njcG7O4MtUs/exec"; 

    let studentDataCache = [];
    let finalSignatureBase64 = "";

    // 全螢幕 Canvas 相關變數
    let fsCanvas = document.getElementById('fullscreenCanvas');
    let fsCtx = fsCanvas.getContext('2d');
    let isDrawing = false;

    // 頁面初次載入時抓取類別
    window.onload = function() {
      loadCategories();
    };

    // 1. 載入類別/學段
    function loadCategories() {
      const select = document.getElementById('categorySelect');
      fetch(`${GAS_WEB_APP_URL}?action=getCategories`)
        .then(res => res.json())
        .then(categories => {
          select.innerHTML = '<option value="">-- 請選擇學段 --</option>';
          if (categories.length === 0) {
            select.innerHTML = '<option value="">(查無學段資料，請檢查試算表)</option>';
            return;
          }
          categories.forEach(cat => {
            select.innerHTML += `<option value="${cat}">${cat}</option>`;
          });
        })
        .catch(err => {
          console.error(err);
          select.innerHTML = '<option value="">-- 載入失敗，請確認 GAS 部署為【新版本】與【所有人】 --</option>';
        });
    }

    // 2. 依學段載入社團
    function loadClubs() {
      const category = document.getElementById('categorySelect').value;
      const clubSelect = document.getElementById('clubSelect');
      if (!category) return;

      clubSelect.innerHTML = '<option value="">載入中...</option>';
      fetch(`${GAS_WEB_APP_URL}?action=getClubs&category=${encodeURIComponent(category)}`)
        .then(res => res.json())
        .then(clubs => {
          clubSelect.innerHTML = '<option value="">-- 請選擇社團 --</option>';
          clubs.forEach(c => {
            clubSelect.innerHTML += `<option value="${c.id}" data-name="${c.name}">${c.name}</option>`;
          });
        });
    }

    // 3. 載入學生名單
    function loadStudents() {
      const clubId = document.getElementById('clubSelect').value;
      const container = document.getElementById('studentListContainer');
      if (!clubId) return;

      container.innerHTML = '載入名單中...';
      fetch(`${GAS_WEB_APP_URL}?action=getStudents&clubId=${encodeURIComponent(clubId)}`)
        .then(res => res.json())
        .then(students => {
          studentDataCache = students;
          if (students.length === 0) {
            container.innerHTML = '<p style="color: #888;">該社團暫無學生資料</p>';
            return;
          }
          container.innerHTML = '';
          students.forEach((s, idx) => {
            container.innerHTML += `
              <div class="student-card">
                <div class="student-info">${s.seat} ${s.name}</div>
                <div class="status-btn-group">
                  <button type="button" class="status-btn active-present" id="btn-p-${idx}" onclick="setStatus(${idx}, '出席')">出席</button>
                  <button type="button" class="status-btn" id="btn-a-${idx}" onclick="setStatus(${idx}, '缺席')">缺席</button>
                </div>
              </div>
            `;
            s.status = "出席"; // 預設值為出席
          });
        });
    }

    // 切換出席/缺席狀態
    function setStatus(idx, status) {
      studentDataCache[idx].status = status;
      const btnP = document.getElementById(`btn-p-${idx}`);
      const btnA = document.getElementById(`btn-a-${idx}`);
      if (status === '出席') {
        btnP.className = 'status-btn active-present';
        btnA.className = 'status-btn';
      } else {
        btnP.className = 'status-btn';
        btnA.className = 'status-btn active-absent';
      }
    }

    // ==========================================
    // 全螢幕 Canvas 手寫繪圖邏輯
    // ==========================================
    function openSignatureModal() {
      const modal = document.getElementById('signatureModal');
      modal.classList.add('active');

      // 設定解析度適應螢幕
      fsCanvas.width = fsCanvas.offsetWidth;
      fsCanvas.height = fsCanvas.offsetHeight;

      fsCtx.lineWidth = 4;
      fsCtx.lineCap = 'round';
      fsCtx.strokeStyle = '#000000';

      initCanvasEvents();
    }

    function initCanvasEvents() {
      // 滑鼠事件
      fsCanvas.onmousedown = (e) => startDraw(e.offsetX, e.offsetY);
      fsCanvas.onmousemove = (e) => draw(e.offsetX, e.offsetY);
      fsCanvas.onmouseup = () => stopDraw();

      // 觸控事件 (手機 / 平板)
      fsCanvas.ontouchstart = (e) => {
        e.preventDefault();
        const rect = fsCanvas.getBoundingClientRect();
        const touch = e.touches[0];
        startDraw(touch.clientX - rect.left, touch.clientY - rect.top);
      };
      fsCanvas.ontouchmove = (e) => {
        e.preventDefault();
        const rect = fsCanvas.getBoundingClientRect();
        const touch = e.touches[0];
        draw(touch.clientX - rect.left, touch.clientY - rect.top);
      };
      fsCanvas.ontouchend = () => stopDraw();
    }

    function startDraw(x, y) {
      isDrawing = true;
      fsCtx.beginPath();
      fsCtx.moveTo(x, y);
    }

    function draw(x, y) {
      if (!isDrawing) return;
      fsCtx.lineTo(x, y);
      fsCtx.stroke();
    }

    function stopDraw() {
      isDrawing = false;
    }

    function clearModalCanvas() {
      fsCtx.clearRect(0, 0, fsCanvas.width, fsCanvas.height);
    }

    function confirmSignature() {
      finalSignatureBase64 = fsCanvas.toDataURL('image/png');
      document.getElementById('signatureModal').classList.remove('active');
      
      const statusNotice = document.getElementById('sigStatusNotice');
      statusNotice.innerText = "✅ 已成功完成導師簽名！";
      statusNotice.style.color = "#27ae60";
      statusNotice.style.fontWeight = "bold";
    }

    // ==========================================
    // 送出點名紀錄給後端
    // ==========================================
    function submitRollcall() {
      const clubSelect = document.getElementById('clubSelect');
      const clubId = clubSelect.value;
      const clubName = clubSelect.options[clubSelect.selectedIndex]?.getAttribute('data-name');

      if (!clubId) {
        alert('請先選擇社團！');
        return;
      }

      if (!finalSignatureBase64) {
        alert('請完成老師親筆簽名後再送出！');
        return;
      }

      const payload = {
        action: "saveRollcall",
        clubId: clubId,
        clubName: clubName,
        signature: finalSignatureBase64,
        records: studentDataCache
      };

      alert('正在提交點名紀錄，請稍候...');

      fetch(GAS_WEB_APP_URL, {
        method: "POST",
        body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(res => {
        if (res.status === "success") {
          alert("🎉 點名成功並已寫入系統！");
          location.reload();
        } else {
          alert("❌ 送出失敗：" + res.message);
        }
      })
      .catch(err => {
        alert("❌ 傳送發生錯誤：" + err);
      });
    }
  </script>
</body>
</html>
