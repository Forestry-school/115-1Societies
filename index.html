<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>福瑞斯特中小學 - 社團線上點名系統</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 背景水彩暈染效果 -->
  <div class="wash wash-1"></div>
  <div class="wash wash-2"></div>
  <div class="wash wash-3"></div>
  <div class="wash wash-4"></div>

  <div class="main-container">
    
    <!-- 標題區塊 -->
    <header class="header-block">
      <!-- 標頭圖案/Logo -->
      <img src="logo.png" alt="福瑞斯特中小學" class="app-logo" onerror="this.style.display='none'; document.getElementById('text-logo').style.display='block';">
      <div id="text-logo" style="display:none; font-size:1.5rem; font-weight:bold; color:var(--green-deep); margin-bottom:8px;">
        🌲 福瑞斯特中小學
      </div>
      <div class="badge-stamp">FORESTRY SCHOOL CLUB</div>
      <h4>115-1 社團線上點名系統</h4>
    </header>

    <!-- 步驟 1：選擇學段 / 社團 -->
    <section class="card">
      <div class="step-eyebrow">
        <span class="num">1</span> 選擇學段 / 時間
      </div>
      
      <label class="form-label" for="categorySelect">選擇學段 / 時間</label>
      <select id="categorySelect" class="form-select" onchange="fetchClubCards()">
        <option value="">-- 載入中... --</option>
      </select>

      <div id="clubSelectContainer" style="display: none;">
        <label class="form-label" for="clubSelect">選擇社團</label>
        <select id="clubSelect" class="form-select" onchange="fetchStudents()">
          <option value="">-- 請選擇社團 --</option>
        </select>
      </div>
    </section>

    <!-- 步驟 2：學生點名表 -->
    <section class="card" id="studentSection" style="display: none;">
      <div class="step-eyebrow">
        <span class="num">2</span> 學生點名表
      </div>
      
      <div id="editNotice" class="edit-notice" style="display: none;">
        ⚠️ 注意：今天已有點名紀錄，再次儲存將會覆蓋舊紀錄。
      </div>

      <div id="studentList">
        <!-- JS 動態生成學生點名列表 -->
      </div>
    </section>

    <!-- 步驟 3：指導老師簽名與送出 -->
    <section class="card" id="signatureSection" style="display: none;">
      <div class="step-eyebrow">
        <span class="num">3</span> 指導老師簽名確認
      </div>

      <div class="signature-preview-box">
        <button type="button" class="btn-outline" onclick="openSignatureModal()">
          ✏️ 點此開啟「全螢幕」手寫簽名
        </button>
        <img id="signaturePreview" src="" alt="簽名預覽" style="display: none; margin-top: 10px;">
      </div>

      <button type="button" class="btn-primary" onclick="submitRollcall()">確認送出點名</button>
    </section>

    <footer class="footer">
      製作人：TATA
    </footer>

  </div>

  <!-- 全螢幕簽名檔 Modal -->
  <div id="signatureModal" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-header">
        <h3>指導老師簽名</h3>
        <button type="button" class="btn-secondary" onclick="closeSignatureModal()">關閉</button>
      </div>
      <div id="modal-canvas-container">
        <canvas id="modal-signature-pad"></canvas>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-secondary" onclick="clearCanvas()">清除重簽</button>
        <button type="button" class="btn-primary" onclick="saveSignature()">完成簽名</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
