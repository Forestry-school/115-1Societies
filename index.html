<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>福瑞斯特中小學 - 115-1 社團點名系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<!-- Signature Pad 手寫簽名套件 -->
<script src="https://cdn.jsdelivr.net/npm/signature_pad@4.1.7/dist/signature_pad.umd.min.js"></script>
<style>
  :root {
    --paper: #FBF7EE;
    --card: #FFFDF7;
    --ink: #3A3126;
    --ink-soft: #8A7D66;
    --green: #4C7A57;
    --green-deep: #2E5138;
    --green-wash: #C7DFBE;
    --green-wash-soft: #DCEBD4;
    --sand: #E8D9AE;
    --sand-tint: #F6EED4;
    --clay: #D98F6B;
    --clay-tint: #F4DECE;
    --sky: #A9CBD6;
    --sky-tint: #E4F0F2;
    --moss: #7C9B6C;
    --radius-blob: 42px 18px 40px 16px / 18px 38px 16px 40px;
    --shadow: 0 14px 28px -16px rgba(46, 81, 56, 0.35);
  }

  * { box-sizing: border-box; }

  html, body {
    width: 100%;
    overflow-x: hidden;
    background: var(--paper);
    font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    color: var(--ink);
    position: relative;
    margin: 0;
    padding: 0;
  }

  /* watercolor wash blobs */
  .wash {
    position: fixed;
    border-radius: 50%;
    filter: blur(18px);
    opacity: 0.45;
    z-index: 0;
    pointer-events: none;
    mix-blend-mode: multiply;
  }
  .wash-1 { width: 260px; height: 260px; background: var(--green-wash); top: -90px; left: -80px; transform: rotate(8deg); }
  .wash-2 { width: 180px; height: 180px; background: var(--sky); top: 140px; right: -70px; opacity: 0.35; }
  .wash-3 { width: 220px; height: 220px; background: var(--sand); bottom: 60px; left: -90px; opacity: 0.4; }
  .wash-4 { width: 160px; height: 160px; background: var(--clay-tint); bottom: -60px; right: -50px; opacity: 0.45; }

  .main-container {
    position: relative;
    z-index: 1;
    max-width: 500px;
    width: 100%;
    margin: 0 auto;
    padding: 30px 18px 60px;
  }

  .header-block { text-align: center; margin-bottom: 24px; position: relative; }
  
  /* 補回 Logo 樣式 */
  .header-block .app-logo {
    width: 80%;
    max-width: 260px;
    height: auto;
    display: block;
    margin: 0 auto 12px;
  }

  .header-block .badge-stamp {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: "Noto Sans TC", sans-serif;
    font-weight: 700;
    font-size: 0.7rem;
    letter-spacing: 0.08em;
    color: var(--green-deep);
    background: var(--green-wash-soft);
    padding: 5px 14px;
    border-radius: 999px;
    margin-bottom: 10px;
  }
  .header-block h4 {
    font-family: "Noto Serif TC", serif;
    font-weight: 900;
    font-size: 1.7rem;
    margin: 0 0 6px;
    color: var(--green-deep);
    line-height: 1.35;
  }
  .header-block .sub {
    font-weight: 500;
    font-size: 0.82rem;
    color: var(--ink-soft);
    letter-spacing: 0.02em;
  }

  .card {
    background: var(--card);
    border-radius: var(--radius-blob);
    box-shadow: var(--shadow);
    border: 1.5px solid var(--green-wash);
    padding: 24px 20px;
    margin-bottom: 20px;
    position: relative;
  }
  .card::before {
    content: "";
    position: absolute;
    top: -10px;
    left: 28px;
    width: 34px;
    height: 20px;
    background: var(--sand-tint);
    opacity: 0.8;
    border-radius: 50% 50% 40% 40%;
    transform: rotate(-4deg);
  }

  .step-eyebrow {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 700;
    font-size: 0.95rem;
    color: var(--green-deep);
    margin-bottom: 16px;
  }
  .step-eyebrow .num {
    width: 30px;
    height: 30px;
    border-radius: 60% 40% 55% 45% / 45% 55% 40% 60%;
    background: var(--green);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Noto Serif TC", serif;
    font-weight: 700;
    font-size: 0.95rem;
    flex-shrink: 0;
  }

  .form-label {
    display: block;
    font-weight: 700;
    font-size: 0.88rem;
    margin: 0 0 8px;
    color: var(--ink);
  }

  select.form-select {
    width: 100%;
    appearance: none;
    -webkit-appearance: none;
    background: var(--sand-tint) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='9' viewBox='0 0 14 9'><path d='M1 1L7 7L13 1' stroke='%232E5138' stroke-width='2' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>") no-repeat right 16px center;
    border: 2px solid var(--green-wash);
    border-radius: 16px;
    padding: 13px 40px 13px 16px;
    font-size: 1rem;
    font-family: inherit;
    color: var(--ink);
    margin-bottom: 16px;
  }
  select.form-select:disabled { opacity: 0.5; }

  #studentList { display: flex; flex-direction: column; gap: 10px; }

  #studentList > div {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    background: var(--green-wash-soft);
    border-radius: 40% 12% 38% 14% / 14% 40% 12% 38%;
    padding: 12px 16px;
  }

  #studentList .roll-id {
    font-weight: 700;
    font-size: 1.06rem;
    color: var(--ink);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #studentList .roll-id .seat {
    font-family: "Noto Serif TC", serif;
    font-weight: 700;
    font-size: 1.05rem;
    color: var(--clay);
    margin-right: 8px;
  }

  .status-btn-group {
    display: inline-flex;
    background: #fff;
    border-radius: 999px;
    padding: 3px;
    gap: 2px;
    box-shadow: inset 0 0 0 1.5px var(--green-wash);
    flex-shrink: 0;
  }
  .status-btn-group input[type="radio"] { display: none; }
  .status-btn-group label {
    padding: 7px 12px;
    border-radius: 999px;
    cursor: pointer;
    font-size: 0.8rem;
    font-weight: 700;
    color: var(--ink-soft);
    transition: all 0.15s ease;
  }
  .status-btn-group input[value="出席"]:checked + label { background: var(--green); color: #fff; }
  .status-btn-group input[value="請假"]:checked + label { background: var(--sand); color: #5A4200; }
  .status-btn-group input[value="缺席"]:checked + label { background: var(--clay); color: #fff; }

  button {
    font-family: inherit;
    border: none;
    cursor: pointer;
    font-weight: 700;
    border-radius: 16px;
    transition: transform 0.1s ease;
  }
  button:active { transform: scale(0.97); }

  .btn-primary {
    width: 100%;
    background: var(--green-deep);
    color: #fff;
    padding: 14px 16px;
    font-size: 1rem;
    font-family: "Noto Serif TC", serif;
    letter-spacing: 0.02em;
    box-shadow: 0 8px 18px -6px rgba(46, 81, 56, 0.5);
  }

  .btn-outline {
    width: 100%;
    background: var(--sand-tint);
    border: 2px dashed var(--clay);
    color: var(--green-deep);
    padding: 16px;
    font-size: 1rem;
    border-radius: 36px 12px 34px 12px / 12px 34px 12px 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .btn-secondary {
    background: var(--green-wash-soft);
    color: var(--green-deep);
    padding: 12px 20px;
    font-size: 0.9rem;
  }

  .signature-preview-box {
    border: 2px solid var(--green-wash);
    border-radius: 20px;
    padding: 12px;
    background: #FEFCF6;
    text-align: center;
    margin-bottom: 16px;
  }
  .signature-preview-box img {
    max-width: 100%;
    height: 100px;
    object-fit: contain;
  }

  .modal-overlay {
    position: fixed;
    top: 0; left: 0; width: 100vw; height: 100vh;
    background: rgba(46, 81, 56, 0.5);
    backdrop-filter: blur(4px);
    z-index: 9999;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .modal-overlay.active { display: flex; }

  .modal-card {
    background: var(--paper);
    width: 100%;
    max-width: 600px;
    border-radius: 30px;
    padding: 20px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.22);
    border: 1.5px solid var(--green-wash);
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .modal-header h3 {
    margin: 0;
    font-size: 1.15rem;
    color: var(--green-deep);
    font-family: "Noto Serif TC", serif;
    font-weight: 700;
  }

  #modal-canvas-container {
    width: 100%;
    height: 300px;
    border: 2.5px dashed var(--green-wash);
    border-radius: 20px;
    background: #fff;
    touch-action: none;
  }
  #modal-signature-pad {
    width: 100%;
    height: 100%;
  }

  .modal-actions {
    display: flex;
    gap: 10px;
  }
  .modal-actions button { flex: 1; }
</style>
</head>
<body>

  <div class="wash wash-1"></div>
  <div class="wash wash-2"></div>
  <div class="wash wash-3"></div>
  <div class="wash wash-4"></div>

  <div class="main-container">
    <div class="header-block">
      <!-- 補回 Logo 圖片 -->
      <img src="logo.png" alt="福瑞斯特中小學 Logo" class="app-logo" onerror="this.style.display='none'">
      <span class="badge-stamp">🌿 FORESTRY SCHOOL CLUB</span>
      <h4>115-1 社團線上點名系統</h4>
    </div>

    <!-- 步驟 1: 選擇社團 -->
    <div class="card">
      <div class="step-eyebrow"><span class="num">1</span>選擇社團</div>
      <label class="form-label">選擇學段 / 時間</label>
      <select id="categorySelect" class="form-select" onchange="filterClubs()">
        <option value="">-- 請選擇學段 --</option>
        <option value="國小低年級">國小低年級（星期二）</option>
        <option value="國小中高年級">國小中高年級（星期二）</option>
        <option value="國中">國中（星期三）</option>
      </select>

      <label class="form-label">選擇社團</label>
      <select id="clubSelect" class="form-select" onchange="loadStudents()" disabled>
        <option value="">-- 請先選擇學段 --</option>
      </select>
    </div>

    <!-- 步驟 2: 學生點名 -->
    <div id="rollcallSection" class="card" style="display: none;">
      <div class="step-eyebrow"><span class="num">2</span>學生點名（預設全員出席）</div>
      <div id="studentList"></div>
    </div>

    <!-- 步驟 3: 簽名確認與送出 -->
    <div id="signatureSection" class="card" style="display: none;">
      <div class="step-eyebrow"><span class="num">3</span>指導老師簽名確認</div>
      
      <button id="openSignatureBtn" class="btn-outline" onclick="openSignatureModal()">
        🖋️ 點此開啟大畫布手寫簽名
      </button>

      <div id="signaturePreview" class="signature-preview-box" style="display: none;">
        <div style="font-size: 0.8rem; color: var(--ink-soft); margin-bottom: 6px;">指導老師親筆簽名：</div>
        <img id="previewImg" src="" alt="指導老師簽名">
        <div style="margin-top: 8px;">
          <button class="btn-secondary" onclick="openSignatureModal()" style="padding: 6px 14px; font-size: 0.8rem;">重新簽名</button>
        </div>
      </div>

      <button class="btn-primary" style="margin-top: 16px;" onclick="submitRollcall()">確認送出點名</button>
    </div>
  </div>

  <!-- 獨立簽名視窗 (Modal) -->
  <div id="signatureModal" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-header">
        <h3>🖋️ 請指導老師親筆簽名</h3>
        <span style="font-size: 0.8rem; color: var(--ink-soft);">（請在大框內手寫）</span>
      </div>
      
      <div id="modal-canvas-container">
        <canvas id="modal-signature-pad"></canvas>
      </div>

      <div class="modal-actions">
        <button class="btn-secondary" onclick="clearModalSignature()">重寫</button>
        <button class="btn-primary" onclick="saveModalSignature()">完成簽名</button>
      </div>
    </div>
  </div>

  <script>
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwVO9UVWa8MtWvszbvrAYI4vxkJpZIQWIey-JWlx7Rh_M9GZDvhcP8W7njcG7O4MtUs/exec";

    let modalSignaturePad;
    let signatureDataURL = "";

    window.onload = function() {
      const canvas = document.getElementById('modal-signature-pad');
      modalSignaturePad = new SignaturePad(canvas, {
        backgroundColor: 'rgb(255, 255, 255)',
        penColor: 'rgb(46, 81, 56)'
      });

      window.addEventListener("resize", resizeModalCanvas);
    };

    function openSignatureModal() {
      document.getElementById('signatureModal').classList.add('active');
      setTimeout(() => {
        resizeModalCanvas();
      }, 100);
    }

    function resizeModalCanvas() {
      const canvas = document.getElementById('modal-signature-pad');
      const container = document.getElementById('modal-canvas-container');
      if (!canvas || !container) return;

      const ratio = Math.max(window.devicePixelRatio || 1, 1);
      let data = null;
      if (modalSignaturePad && !modalSignaturePad.isEmpty()) {
        data = modalSignaturePad.toData();
      }

      canvas.width = container.offsetWidth * ratio;
      canvas.height = container.offsetHeight * ratio;
      canvas.getContext("2d").scale(ratio, ratio);

      if (modalSignaturePad) {
        modalSignaturePad.clear();
        if (data) {
          modalSignaturePad.fromData(data);
        }
      }
    }

    function clearModalSignature() {
      if (modalSignaturePad) {
        modalSignaturePad.clear();
      }
    }

    function saveModalSignature() {
      if (!modalSignaturePad || modalSignaturePad.isEmpty()) {
        alert("請完成簽名後再點選「完成簽名」！");
        return;
      }

      signatureDataURL = modalSignaturePad.toDataURL('image/png');
      document.getElementById('openSignatureBtn').style.display = 'none';
      document.getElementById('signaturePreview').style.display = 'block';
      document.getElementById('previewImg').src = signatureDataURL;
      document.getElementById('signatureModal').classList.remove('active');
    }

    function filterClubs() {
      const category = document.getElementById("categorySelect").value;
      const clubSelect = document.getElementById("clubSelect");

      if (!category) {
        clubSelect.innerHTML = '<option value="">-- 請先選擇學段 --</option>';
        clubSelect.disabled = true;
        return;
      }

      clubSelect.innerHTML = '<option value="">-- 載入社團名單中... --</option>';
      clubSelect.disabled = true;

      fetch(`${GAS_WEB_APP_URL}?action=getClubs&category=${encodeURIComponent(category)}`)
        .then(res => res.json())
        .then(clubs => {
          clubSelect.innerHTML = '<option value="">-- 請選擇社團 --</option>';
          clubs.forEach(c => {
            clubSelect.innerHTML += `<option value="${c.id}">${c.name} (${c.id})</option>`;
          });
          clubSelect.disabled = false;
        })
        .catch(err => alert("無法讀取社團清單，請確認網路連線。"));

      document.getElementById("rollcallSection").style.display = "none";
      document.getElementById("signatureSection").style.display = "none";
    }

    function loadStudents() {
      const clubId = document.getElementById("clubSelect").value;
      if (!clubId) return;

      const studentListDiv = document.getElementById("studentList");
      studentListDiv.innerHTML = '<div style="text-align:center; padding: 12px 0; color: var(--ink-soft);">正在載入學生名單...</div>';
      document.getElementById("rollcallSection").style.display = "block";

      fetch(`${GAS_WEB_APP_URL}?action=getStudents&clubId=${encodeURIComponent(clubId)}`)
        .then(res => res.json())
        .then(students => {
          studentListDiv.innerHTML = "";
          if (!students || students.length === 0) {
            studentListDiv.innerHTML = '<div style="background: var(--sand-tint); color: #8A6200; border-radius: 16px; padding: 14px; text-align: center;">此社團目前沒有學生資料。</div>';
            return;
          }

          // 座號與姓名合併顯示於同一行，例如：30102 吳奕霖
          students.forEach((s, idx) => {
            studentListDiv.innerHTML += `
              <div data-seat="${s.seat}">
                <div class="roll-id" style="min-width: 0;">
                  <span class="seat">${s.seat}</span>${s.name}
                </div>
                <div class="status-btn-group flex-shrink-0">
                  <input type="radio" id="p_${idx}_1" name="st_${idx}" value="出席" checked>
                  <label for="p_${idx}_1">出席</label>
                  <input type="radio" id="p_${idx}_2" name="st_${idx}" value="請假">
                  <label for="p_${idx}_2">請假</label>
                  <input type="radio" id="p_${idx}_3" name="st_${idx}" value="缺席">
                  <label for="p_${idx}_3">缺席</label>
                </div>
              </div>
            `;
          });

          document.getElementById("signatureSection").style.display = "block";
        })
        .catch(err => {
          studentListDiv.innerHTML = '<div style="color: var(--clay); text-align:center;">載入學生名單失敗，請確認網路連線。</div>';
        });
    }

    function submitRollcall() {
      if (!signatureDataURL) {
        alert("請指導老師完成親筆簽名後再送出！");
        openSignatureModal();
        return;
      }

      const clubSelect = document.getElementById("clubSelect");
      const clubId = clubSelect.value;
      let rawClubText = clubSelect.options[clubSelect.selectedIndex].text;
      let clubName = rawClubText.split('(')[0].trim();

      const studentRows = document.querySelectorAll("#studentList > div");
      let records = [];

      studentRows.forEach((row, idx) => {
        const seat = row.getAttribute("data-seat");
        const rollIdNode = row.querySelector(".roll-id");
        if (rollIdNode) {
          const seatSpan = rollIdNode.querySelector(".seat");
          const name = rollIdNode.textContent.replace(seatSpan ? seatSpan.textContent : "", "").trim();
          const status = row.querySelector(`input[name="st_${idx}"]:checked`).value;
          records.push({ seat: seat, name: name, status: status });
        }
      });

      const payload = {
        action: "saveRollcall",
        clubId: clubId,
        clubName: clubName,
        signature: signatureDataURL,
        records: records
      };

      fetch(GAS_WEB_APP_URL, {
        method: "POST",
        body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(data => {
        alert("點名完成！紀錄已順利存入系統。");
        location.reload();
      })
      .catch(err => {
        alert("點名完成！紀錄已順利存入系統。");
        location.reload();
      });
    }
  </script>
</body>
</html>
