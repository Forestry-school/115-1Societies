<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>福瑞斯特中小學 - 社團線上點名系統</title>
  <link rel="stylesheet" href="style.css">
  <!-- 引入 SignaturePad 簽名板函式庫 -->
  <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.0.0/dist/signature_pad.umd.min.js"></script>
</head>
<body>

  <div class="container">
    <!-- 標頭 -->
    <header class="header">
      <div class="logo-area">
        <h1 class="school-title">🌲 福瑞斯特中小學</h1>
        <p class="school-sub">Forestry Elementary and Junior High School</p>
      </div>
      <div class="badge">FORESTRY SCHOOL CLUB</div>
      <h2 class="system-title">115-1 社團線上點名系統</h2>
    </header>

    <!-- 步驟 1：選擇學段/時間 -->
    <section class="card-box">
      <div class="step-title"><span>1</span> 選擇學段 / 時間</div>
      <div class="form-group">
        <label for="categorySelect">選擇學段 / 時間</label>
        <select id="categorySelect" class="form-select">
          <option value="">-- 載入中... --</option>
        </select>
      </div>
    </section>

    <!-- 步驟 2：社團卡片列表 (預設隱藏) -->
    <section id="clubSection" class="card-box" style="display: none;">
      <div class="step-title"><span>2</span> 選擇社團</div>
      <div id="clubCardContainer" class="club-grid">
        <!-- 卡片將由 JS 動態生成 -->
      </div>
    </section>

    <!-- 表單包覆：點名表與簽名 -->
    <form id="rollcallForm">
      <!-- 步驟 3：學生點名名單 (預設隱藏) -->
      <section id="rollcallSection" class="card-box" style="display: none;">
        <div class="step-title"><span>3</span> 學生點名表</div>
        <div id="studentList">
          <!-- 點名表格將由 JS 動態生成 -->
        </div>
      </section>

      <!-- 步驟 4：指導老師簽名 (預設隱藏) -->
      <section id="signatureSection" class="card-box" style="display: none;">
        <div class="step-title"><span>4</span> 指導老師簽名</div>
        <div class="signature-container">
          <canvas id="signatureCanvas"></canvas>
          <div class="signature-tools">
            <button type="button" id="clearSigBtn" class="btn-secondary">清除重簽</button>
          </div>
        </div>
        <div class="submit-area">
          <button type="submit" id="submitBtn" class="btn-primary">儲存點名紀錄</button>
        </div>
      </section>
    </form>

    <footer class="footer">
      製作人：TATA
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
