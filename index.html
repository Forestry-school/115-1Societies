<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <!-- 防止手機使用者縮放導致畫面跑版 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>福瑞斯特中小學 - 115-1 社團點名系統</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Signature Pad 手寫簽名套件 -->
  <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.0.0/dist/signature_pad.umd.min.js"></script>
  <style>
    /* 全域防跑版設定 */
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      overflow-x: hidden; /* 徹底杜絕手機左右滑動跑版 */
      background-color: #f4f6f9;
      font-family: "Microsoft JhengHei", sans-serif;
    }
    
    .main-container {
      max-width: 500px; /* 電腦端維持精致寬度，手機端 100% 滿版 */
      width: 100%;
      margin: 0 auto;
      padding: 15px;
    }

    .card {
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      border: none;
    }

    /* 點名按鈕響應式優化 */
    .status-btn-group {
      display: flex;
      gap: 4px;
    }
    .status-btn-group input[type="radio"] { display: none; }
    .status-btn-group label {
      padding: 6px 10px;
      border: 1px solid #ced4da;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: bold;
      white-space: nowrap;
    }
    .status-btn-group input[value="出席"]:checked + label { background-color: #198754; color: white; border-color: #198754; }
    .status-btn-group input[value="請假"]:checked + label { background-color: #ffc107; color: black; border-color: #ffc107; }
    .status-btn-group input[value="缺席"]:checked + label { background-color: #dc3545; color: white; border-color: #dc3545; }

    /* 手寫板容器防超頁與防滑動 */
    #canvas-container {
      width: 100%;
      border: 2px dashed #adb5bd;
      border-radius: 8px;
      background: #fff;
      touch-action: none; /* 防止手機簽名時帶動網頁滾動 */
    }
    canvas {
      width: 100% !important;
      height: 160px !important;
      display: block;
    }
  </style>
</head>
<body>

  <div class="main-container">
    <!-- 校徽與標頭區塊（已修復圖片超出問題） -->
    <div class="text-center mb-3">
      <img src="logo.jpg" alt="福瑞斯特中小學 Logo" style="max-width: 100%; height: auto; display: block; margin: 0 auto;" class="mb-2" onerror="this.style.display='none'">
      <h4 class="fw-bold text-primary mb-0">115-1 社團線上點名系統</h4>
    </div>

    <!-- 步驟 1: 選擇學段與社團 -->
    <div class="card p-3 mb-3">
      <div class="mb-3">
        <label class="form-label fw-bold">1. 選擇學段 / 時間</label>
        <select id="categorySelect" class="form-select form-select-lg" onchange="filterClubs()">
          <option value="">-- 請選擇學段 --</option>
          <option value="國小低年級">國小低年級（星期二）</option>
          <option value="國小中高年級">國小中高年級（星期二）</option>
          <option value="國中">國中（星期三）</option>
        </select>
      </div>

      <div>
        <label class="form-label fw-bold">2. 選擇社團</label>
        <select id="clubSelect" class="form-select form-select-lg" onchange="loadStudents()" disabled>
          <option value="">-- 請先選擇學段 --</option>
        </select>
      </div>
    </div>

    <!-- 步驟 2: 學生點名清單 -->
    <div id="rollcallSection" class="card p-3 mb-3" style="display: none;">
      <h6 class="fw-bold mb-3 text-secondary">3. 學生點名 (預設全員出席)</h6>
      <div id="studentList"></div>
    </div>

    <!-- 步驟 3: 指導老師親筆簽名 -->
    <div id="signatureSection" class="card p-3 mb-3" style="display: none;">
      <h6 class="fw-bold mb-2 text-secondary">4. 指導老師簽名確認</h6>
      <div id="canvas-container" class="mb-2">
        <canvas id="signature-pad"></canvas>
      </div>
      <div class="d-flex justify-content-between align-items-center mb-3">
        <button class="btn btn-sm btn-outline-secondary" onclick="clearSignature()">重新簽名</button>
        <small class="text-muted">請在上方畫布手寫簽名</small>
      </div>
      <button class="btn btn-primary btn-lg w-100 fw-bold" onclick="submitRollcall()">確認送出點名</button>
    </div>
  </div>

  <script>
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbz2hL5IREZFWhJiwMwSLcMkMP1oPPczBOZLmMpKfYDnrXxzdhuHlGYpvON7zKlQ23BD/exec";

    let signaturePad;
    let lastCanvasWidth = 0; // 記錄前一次寬度，防止手機滑動時重複觸發重繪

    window.onload = function() {
      const canvas = document.getElementById('signature-pad');
      signaturePad = new SignaturePad(canvas, {
        backgroundColor: 'rgb(255, 255, 255)',
        penColor: 'rgb(0, 0, 0)'
      });
      
      resizeCanvas(true);
      
      // 只有在螢幕寬度真正改變時才重繪，避免手機上下滾動觸發 resize
      window.addEventListener("resize", () => {
        if (canvas.offsetWidth !== lastCanvasWidth) {
          resizeCanvas(false);
        }
      });
    };

    // 調整 Canvas 解析度與尺寸（帶有筆跡保存功能）
    function resizeCanvas(forceClear) {
      const canvas = document.getElementById('signature-pad');
      if (!canvas) return;

      lastCanvasWidth = canvas.offsetWidth;
      const ratio = Math.max(window.devicePixelRatio || 1, 1);
      
      let data = null;
      if (!forceClear && signaturePad && !signaturePad.isEmpty()) {
        data = signaturePad.toData();
      }

      canvas.width = canvas.offsetWidth * ratio;
      canvas.height = canvas.offsetHeight * ratio;
      canvas.getContext("2d").scale(ratio, ratio);

      if (signaturePad) {
        signaturePad.clear();
        if (data) {
          signaturePad.fromData(data); // 復原簽名軌跡
        }
      }
    }

    function filterClubs() {
      const category = document.getElementById("categorySelect").value;
      const clubSelect = document.getElementById("clubSelect");
      
      if (!category) {
        clubSelect.innerHTML = '<option value="">-- 請先選擇學段 --</option>';
        clubSelect.disabled = true;
        return;
      }

      clubSelect.innerHTML = '<option value="">-- 載入社團名單中... --</option>';
      clubSelect.disabled = true;

      fetch(`${GAS_WEB_APP_URL}?action=getClubs&category=${encodeURIComponent(category)}`)
        .then(res => res.json())
        .then(clubs => {
          clubSelect.innerHTML = '<option value="">-- 請選擇社團 --</option>';
          clubs.forEach(c => {
            clubSelect.innerHTML += `<option value="${c.id}">${c.name} (${c.id})</option>`;
          });
          clubSelect.disabled = false;
        })
        .catch(err => alert("無法讀取社團清單，請確認網路連線。"));

      document.getElementById("rollcallSection").style.display = "none";
      document.getElementById("signatureSection").style.display = "none";
    }

    function loadStudents() {
      const clubId = document.getElementById("clubSelect").value;
      if (!clubId) return;

      const studentListDiv = document.getElementById("studentList");
      studentListDiv.innerHTML = '<div class="text-center py-3 text-muted">正在載入學生名單...</div>';
      document.getElementById("rollcallSection").style.display = "block";

      fetch(`${GAS_WEB_APP_URL}?action=getStudents&clubId=${encodeURIComponent(clubId)}`)
        .then(res => res.json())
        .then(students => {
          studentListDiv.innerHTML = "";
          if (students.length === 0) {
            studentListDiv.innerHTML = '<div class="alert alert-warning m-0">此社團目前沒有學生資料。</div>';
            return;
          }

          students.forEach((s, idx) => {
            studentListDiv.innerHTML += `
              <div class="d-flex justify-content-between align-items-center border-bottom py-2" data-seat="${s.seat}">
                <div class="me-2" style="min-width: 0;">
                  <span class="badge bg-secondary mb-1" style="font-size:0.75rem;">${s.seat}</span>
                  <div class="fw-bold text-truncate" style="font-size: 1.05rem;">${s.name}</div>
                </div>
                <div class="status-btn-group flex-shrink-0">
                  <input type="radio" id="p_${idx}_1" name="st_${idx}" value="出席" checked>
                  <label for="p_${idx}_1">出席</label>
                  <input type="radio" id="p_${idx}_2" name="st_${idx}" value="請假">
                  <label for="p_${idx}_2">請假</label>
                  <input type="radio" id="p_${idx}_3" name="st_${idx}" value="缺席">
                  <label for="p_${idx}_3">缺席</label>
                </div>
              </div>
            `;
          });
          
          document.getElementById("signatureSection").style.display = "block";
          
          setTimeout(() => {
            resizeCanvas(false);
          }, 200);
        });
    }

    function clearSignature() { 
      if (signaturePad) {
        signaturePad.clear(); 
      }
    }

    function submitRollcall() {
      if (!signaturePad || signaturePad.isEmpty()) {
        alert("請指導老師完成親筆簽名後再送出！");
        return;
      }

      const clubSelect = document.getElementById("clubSelect");
      const clubId = clubSelect.value;
      const clubName = clubSelect.options[clubSelect.selectedIndex].text;
      const studentRows = document.querySelectorAll("#studentList > div");
      let records = [];

      studentRows.forEach((row, idx) => {
        const seat = row.getAttribute("data-seat");
        const name = row.querySelector(".fw-bold").innerText;
        const status = row.querySelector(`input[name="st_${idx}"]:checked`).value;
        records.push({ seat: seat, name: name, status: status });
      });

      const payload = {
        action: "saveRollcall",
        school: "福瑞斯特中小學",
        semester: "115-1",
        clubId: clubId,
        clubName: clubName,
        date: new Date().toLocaleDateString('zh-TW'),
        signature: signaturePad.toDataURL('image/png'),
        records: records
      };

      fetch(GAS_WEB_APP_URL, {
        method: "POST",
        body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(data => {
        alert("點名完成！紀錄已順利存入系統。");
        location.reload();
      })
      .catch(err => {
        alert("資料已送出！");
        location.reload();
      });
    }
  </script>
</body>
</html>
